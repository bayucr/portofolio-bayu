<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Bayu Catur Ramadhan | Full Stack Developer</title>

      name="description"
      content="Portofolio Bayu Catur Ramadhan, Full Stack Developer (JavaScript, React, Express). Portfolio of Bayu Catur Ramadhan, junior full stack web developer."

    <!-- Pratinjau saat link dibagikan (WhatsApp, LinkedIn, dll.) -->
    <meta property="og:type" content="website" />

      property="og:title"
      content="Bayu Catur Ramadhan | Full Stack Developer"
    />
    <meta
      property="og:description"
      content="Portofolio proyek web dengan JavaScript, React, dan Express."
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
